[package]
name = "c2pa-raw-crypto-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[features]
default = ["rust_native_crypto"]
rust_native_crypto = ["c2pa_raw_crypto/rust_native_crypto"]
openssl = ["c2pa_raw_crypto/openssl"]

[dependencies]
libfuzzer-sys = "0.4"
c2pa_raw_crypto = { path = "..", default-features = false }

[[bin]]
name = "ec_der"
path = "fuzz_targets/ec_der.rs"
test = false
doc = false
bench = false

[[bin]]
name = "private_key"
path = "fuzz_targets/private_key.rs"
test = false
doc = false
bench = false

[[bin]]
name = "signature_validation"
path = "fuzz_targets/signature_validation.rs"
test = false
doc = false
bench = false
